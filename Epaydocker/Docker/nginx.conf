server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 64m;
    server_tokens off;

    # 不能从网页访问的目录和文件：
    # 程序库和支付插件（只能被 PHP 引用）、Docker 目录（里面有 .env 和数据库数据文件）、
    # 版本库、安装用的 SQL、说明文件和所有隐藏文件。
    location ^~ /includes/ { deny all; }
    location ^~ /plugins/  { deny all; }
    location ^~ /Docker/   { deny all; }
    location ~ /\.         { deny all; }
    location ~* \.(sql|txt|md|log|lock|bak|env|ini|sh|yml|yaml)$ { deny all; }

    # 彩虹易支付的伪静态规则（与仓库里 nginx.txt 相同）：/pay/notify/... 等回调地址依赖它
    location / {
        if (!-e $request_filename) {
            rewrite ^/(.[a-zA-Z0-9\-\_]+).html$ /index.php?mod=$1 last;
        }
        rewrite ^/pay/(.*)$ /pay.php?s=$1 last;
        rewrite ^/api/(.*)$ /api.php?s=$1 last;
        rewrite ^/doc/(.[a-zA-Z0-9\-\_]+).html$ /index.php?doc=$1 last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass web:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 180;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
